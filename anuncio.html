<body>

     <main>
    <section class="properties-section">
      <div class="container">
        <h2 class="section-title">Propiedades disponibles</h2>

        <div class="properties-grid" id="propertiesGrid">

          <!-- CARD 04 – Apartamento / Alquiler -->
          <div class="property-card">
            <div class="card-image">
              <img src="assets/images/imgAnuncio/apartamento004/sala.png" alt="Apartamento">
              <span class="badge badge-alquiler">Alquiler</span>
              <button class="btn-favorite" aria-label="Favorito">
                <span class="material-symbols-rounded">favorite</span>
              </button>
            </div>
            <div class="card-body">
              <div class="card-header-row">
                <h3 class="property-type">Apartamento</h3>
                <span class="property-code">cod:004</span>
              </div>
              
              <p class="property-location">
                <span class="material-symbols-rounded">location_on</span>
                Sta Fe de Ant, Buga
              </p>
              <div class="card-divider"></div>
              <div class="property-specs">
                <div class="spec-item">
                  <span class="material-symbols-rounded">straighten</span>
                  <span>100 m²</span>
                </div>
                <div class="spec-item">
                  <span class="material-symbols-rounded">bed</span>
                  <span>1 hab</span>
                </div>
                <div class="spec-item">
                  <span class="material-symbols-rounded">shower</span>
                  <span>1 baño</span>
                </div>
                <div class="spec-item">
                  <span class="material-symbols-rounded">garage_home</span>
                  <span>No</span>
                </div>
              </div>
            </div>
            <div class="card-footer">
              <span class="property-price">$ 5.000.000</span>
              <a href="detalle.html" class="btn-detail">Ver Detalle</a>
            </div>
          </div>
        </div>

      </div>
    </section>
  </main>
